<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ランダムポケロード</title><style>
:root{font-family:system-ui,-apple-system,'Hiragino Kaku Gothic ProN',sans-serif;color:#eaf0ff;background:#0c1428}*{box-sizing:border-box}body{margin:0}main{max-width:1000px;margin:auto;padding:28px 16px 70px}.top{padding:25px 0 12px}h1{font-size:clamp(27px,5vw,42px);margin:0 0 8px}.sub{color:#a9b8d3;line-height:1.7}.panel{background:#16233d;border:1px solid #314360;border-radius:20px;padding:20px;margin-top:20px}h2{font-size:21px;margin:0 0 12px}.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:16px 0}.btn{background:#304565;color:white;border:1px solid #526789;padding:11px 16px;border-radius:11px;font-weight:700;cursor:pointer}.btn.primary{background:#f5c842;border:0;color:#1d2331}.btn:disabled{opacity:.45;cursor:not-allowed}.search{flex:1;min-width:180px;background:#0c172d;color:white;border:1px solid #526789;border-radius:11px;padding:12px;font-size:16px}.count{color:#f5cf61;font-weight:700}.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:9px;max-height:480px;overflow:auto;padding:3px}.poke{display:flex;align-items:center;gap:10px;background:#202f4b;border:1px solid #354868;border-radius:12px;padding:12px;cursor:pointer}.poke:has(input:checked){background:#273e5a;border-color:#f5c842}.poke input{width:19px;height:19px;accent-color:#f5c842;flex-shrink:0}.name{font-weight:700;font-size:14px}.skill{color:#afbed5;font-size:12px;margin-top:3px}.note{font-size:13px;color:#a9b8d3}.results{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.result{background:#203351;border-radius:15px;padding:20px 12px;min-height:140px;text-align:center;border:1px solid #3c5374}.result strong{display:block;color:#f5cf61;margin-bottom:17px}.result .who{font-weight:800;font-size:19px;overflow-wrap:anywhere}.result .skill{font-size:13px;margin-top:9px}.error{color:#ffb4a8;min-height:22px}.footer{color:#8e9cb5;font-size:12px;margin-top:24px}@media(max-width:650px){.results{grid-template-columns:1fr}.result{min-height:110px}.panel{padding:15px}.list{grid-template-columns:1fr 1fr;gap:7px}.poke{padding:9px 7px}.name{font-size:12px}.skill{font-size:11px}}
</style></head><body><main><header class="top"><h1>🎲 ランダムポケロード</h1><div class="sub">育成済みのポケモンをチェックして、3つの枠からランダムに編成を作ろう！</div></header><section class="panel"><h2>① ポケモンを選択</h2><div class="sub">PDFに掲載された全50体から、抽選対象にするポケモンを選んでください。</div><div class="toolbar"><input id="search" class="search" placeholder="ポケモン名・スキルで検索"><button class="btn" id="all">すべて選択</button><button class="btn" id="none">選択解除</button></div><div class="toolbar"><span class="count" id="count">0体選択中</span><span class="note">チェックしたポケモンだけが抽選対象です</span></div><div id="list" class="list"></div></section><section class="panel"><h2>② 3体を抽選</h2><p class="sub">「その他」「タイプレス」「高火力スキル」から1体ずつ選びます。同じポケモンが重複しない編成を作ります。</p><button class="btn primary" id="draw">🎲 3体を抽選する</button><p class="error" id="error" role="status"></p></section><section class="panel"><h2>③ 三体の編成</h2><div class="results" id="results"><div class="result"><strong>その他</strong><span class="note">抽選待ち</span></div><div class="result"><strong>タイプレス</strong><span class="note">抽選待ち</span></div><div class="result"><strong>高火力スキル</strong><span class="note">抽選待ち</span></div></div></section><p class="footer">掲載ポケモン・スキル・分類は提供されたPDFに基づきます。非公式ファン制作ツールです。</p></main><script>
const data=[{"name": "ゲンシカイオーガ", "skill": "いわはじきα", "groups": [0, 2]}, {"name": "ゲンシグラードン", "skill": "バリアはじきΩ", "groups": [0, 2]}, {"name": "レジギガス", "skill": "はじきだす", "groups": [0, 2]}, {"name": "ホワイトキュレム", "skill": "バリアはじき", "groups": [0, 2]}, {"name": "ブラックキュレム", "skill": "ブロックはじき", "groups": [0, 2]}, {"name": "イベルタル", "skill": "ブロックくずし+", "groups": [0]}, {"name": "ディアルガ", "skill": "ブロックくずし+", "groups": [0]}, {"name": "レシラム", "skill": "バリアけし++", "groups": [0]}, {"name": "ゼクロム", "skill": "ブロックブレイク", "groups": [0]}, {"name": "シルヴァディ", "skill": "タイプレスコンボ", "groups": [1]}, {"name": "ネクロズマ", "skill": "はかい", "groups": [0, 2]}, {"name": "カイオーガ", "skill": "いわはじき", "groups": [0, 2]}, {"name": "グラードン", "skill": "バリアはじき", "groups": [0, 2]}, {"name": "メガニウム", "skill": "ブロックはじき", "groups": [0, 2]}, {"name": "バクフーン", "skill": "いわはじき", "groups": [0, 2]}, {"name": "オーダイル", "skill": "バリアはじき", "groups": [0, 2]}, {"name": "フーパ（いましめ）", "skill": "シャドーショック", "groups": [0, 2]}, {"name": "デオキシス（ディフェンス）", "skill": "バリアはじき", "groups": [0, 2]}, {"name": "ジガルデ（50%）", "skill": "タイプレスコンボ", "groups": [1]}, {"name": "ディアンシー（色違い）", "skill": "ブロックはじき", "groups": [0, 2]}, {"name": "ジバコイル", "skill": "バリアはじき", "groups": [0, 2]}, {"name": "ベトベトン", "skill": "ブロックはじき", "groups": [0, 2]}, {"name": "フラージェス", "skill": "いわはじき", "groups": [0, 2]}, {"name": "ガチゴラス", "skill": "ブロックはじき", "groups": [0, 2]}, {"name": "オンバーン", "skill": "はじきだす", "groups": [0, 2]}, {"name": "メガヤンマ", "skill": "メガパワー+", "groups": [0]}, {"name": "タイプ：ヌル", "skill": "ブロックオフ", "groups": [0]}, {"name": "エンニュート", "skill": "はじきだす", "groups": [0, 2]}, {"name": "フーパ（ときはな）", "skill": "タイプレスコンボ", "groups": [1]}, {"name": "ニダンギル", "skill": "バリアはじき", "groups": [0, 2]}, {"name": "オーベム", "skill": "いわはじき", "groups": [0, 2]}, {"name": "ダグトリオ", "skill": "ブロックはじき", "groups": [0, 2]}, {"name": "ドヒドイデ", "skill": "バリアはじき", "groups": [0, 2]}, {"name": "フライゴン", "skill": "はじきだす", "groups": [0, 2]}, {"name": "バンギラス（色違い）", "skill": "バリアはじき", "groups": [0, 2]}, {"name": "デオキシス（アタック）", "skill": "タイプレスコンボ", "groups": [1]}, {"name": "チルット", "skill": "メガパワー+", "groups": [0]}, {"name": "コフーライ", "skill": "はじきだす", "groups": [0, 2]}, {"name": "イワパレス", "skill": "いわはじき", "groups": [0, 2]}, {"name": "カプ・コケコ", "skill": "タイプレスコンボ", "groups": [1]}, {"name": "カプ・テテフ", "skill": "タイプレスコンボ", "groups": [1]}, {"name": "カプ・ブルル", "skill": "タイプレスコンボ", "groups": [1]}, {"name": "カプ・レヒレ", "skill": "タイプレスコンボ", "groups": [1]}, {"name": "バイバニラ", "skill": "はじきだす", "groups": [0, 2]}, {"name": "オーロット", "skill": "はじきだす", "groups": [0, 2]}, {"name": "サワムラー", "skill": "はじきだす", "groups": [0, 2]}, {"name": "フワライド", "skill": "バリアはじき", "groups": [0, 2]}, {"name": "オニシズクモ", "skill": "はじきだす", "groups": [0, 2]}, {"name": "ニャース（アローラ）", "skill": "はじきだす", "groups": [0, 2]}, {"name": "キルリア", "skill": "はじきだす", "groups": [0, 2]}];const labels=['その他','タイプレス','高火力スキル'];const chosen=new Set();const list=document.getElementById('list'),count=document.getElementById('count'),search=document.getElementById('search'),error=document.getElementById('error');
function render(){const q=search.value.trim().toLowerCase();list.replaceChildren();data.forEach((p,i)=>{if(!(p.name+p.skill).toLowerCase().includes(q))return;const label=document.createElement('label');label.className='poke';const input=document.createElement('input');input.type='checkbox';input.checked=chosen.has(i);input.addEventListener('change',()=>{input.checked?chosen.add(i):chosen.delete(i);update()});const body=document.createElement('span');const name=document.createElement('div');name.className='name';name.textContent=p.name;const skill=document.createElement('div');skill.className='skill';skill.textContent=p.skill;body.append(name,skill);label.append(input,body);list.append(label)});update()}
function update(){count.textContent=chosen.size+'体選択中';error.textContent=''}search.addEventListener('input',render);document.getElementById('all').onclick=()=>{data.forEach((_,i)=>chosen.add(i));render()};document.getElementById('none').onclick=()=>{chosen.clear();render()};
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function draw(){const pools=labels.map((_,g)=>shuffle([...chosen].filter(i=>data[i].groups.includes(g))));const missing=labels.filter((_,g)=>!pools[g].length);if(missing.length){error.textContent='抽選できません。「'+missing.join('」「')+'」に該当するポケモンを選択してください。';return}let result=null;function pick(g,used,acc){if(g===3){result=[...acc];return true}for(const i of pools[g]){if(used.has(i))continue;used.add(i);acc.push(i);if(pick(g+1,used,acc))return true;acc.pop();used.delete(i)}return false}if(!pick(0,new Set(),[])){error.textContent='重複なしで3体を選べません。選択するポケモンを増やしてください。';return}error.textContent='';const root=document.getElementById('results');root.replaceChildren();result.forEach((i,g)=>{const p=data[i],box=document.createElement('div');box.className='result';const title=document.createElement('strong');title.textContent=labels[g];const who=document.createElement('div');who.className='who';who.textContent=p.name;const skill=document.createElement('div');skill.className='skill';skill.textContent='スキル：'+p.skill;box.append(title,who,skill);root.append(box)});root.scrollIntoView({behavior:'smooth',block:'center'})}document.getElementById('draw').onclick=draw;render();
</script></body></html>
