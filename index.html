const selected=new Set();
const STORAGE_KEY="pokemon3team_selected_v2";
try{const ids=JSON.parse(localStorage.getItem(STORAGE_KEY)||"[]");if(Array.isArray(ids))ids.forEach(id=>{if(Number.isInteger(id)&&id>=0&&id<pokemon.length)selected.add(id)})}catch(e){}

function update(){count.textContent=selected.size+'体選択中';document.getElementById('draw').disabled=selected.size<3;persist();}
for(const p of pokemon){const el=document.createElement('label');el.className='poke';const inp=document.createElement('input');inp.type='checkbox';inp.checked=selected.has(p.id);inp.addEventListener('change',()=>{if(inp.checked)selected.add(p.id);else selected.delete(p.id);update()});const im=document.createElement('img');im.src=p.img;im.alt='ポケモンのアイコン';const skill=document.createElement('span');skill.className='skill';skill.textContent=p.skill;el.append(inp,im,skill);grid.append(el)}
function setAll(value){document.querySelectorAll('.poke input').forEach((e,i)=>{e.checked=value;if(value)selected.add(i);else selected.delete(i)});update()}
document.getElementById('all').onclick=()=>setAll(true);document.getElementById('none').onclick=()=>setAll(false);
function restoreIds(ids){selected.clear();for(const id of ids){if(Number.isInteger(id)&&id>=0&&id<pokemon.length)selected.add(id)}document.querySelectorAll('.poke input').forEach((input,i)=>input.checked=selected.has(pokemon[i].id));update();render();notice.textContent='';}
// PNGの最上段に選択データを格納。画像編集やスクリーンショットでは復元できません。
document.getElementById('saveImage').onclick=async()=>{
 const ids=[...selected].sort((a,b)=>a-b), width=800, columns=10, cell=76, rows=Math.max(1,Math.ceil(ids.length/columns));
 const canvas=document.createElement('canvas');canvas.width=width;canvas.height=76+rows*cell+28;const ctx=canvas.getContext('2d');
 ctx.fillStyle='#141824';ctx.fillRect(0,0,width,canvas.height);
 ctx.fillStyle='#f1f4ff';ctx.font='bold 22px sans-serif';ctx.fillText('ポケモン選択データ',20,39);ctx.font='14px sans-serif';ctx.fillText(ids.length+'体選択済み',620,38);
 const pictures=await Promise.all(ids.map(id=>new Promise(resolve=>{const img=new Image();img.onload=()=>resolve(img);img.onerror=()=>resolve(null);img.src=pokemon[id].img})));
 ids.forEach((id,i)=>{const x=20+(i%columns)*cell,y=72+Math.floor(i/columns)*cell;ctx.fillStyle='#303b59';ctx.fillRect(x,y,68,68);if(pictures[i])ctx.drawImage(pictures[i],x+7,y+5,54,54);});
 // 先頭行のピクセルは選択IDを復元するためのデータ
 const data=ctx.getImageData(0,0,width,1);const bytes=[80,75,51,1,pokemon.length&255,(pokemon.length>>8)&255,...pokemon.map(p=>selected.has(p.id)?1:0)];
 bytes.forEach((b,i)=>{const at=i*4;data.data[at]=b;data.data[at+1]=0;data.data[at+2]=0;data.data[at+3]=255});ctx.putImageData(data,0,0);
 const link=document.createElement('a');link.download='pokemon_selection.png';link.href=canvas.toDataURL('image/png');link.click();status.textContent='選択画像を保存しました。次回「選択画像を読み込む」で復元できます。';
};
document.getElementById('loadImage').onclick=()=>document.getElementById('imageFile').click();
document.getElementById('imageFile').onchange=async(e)=>{const file=e.target.files[0];if(!file)return;try{
 const url=URL.createObjectURL(file);const img=new Image();await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=reject;img.src=url});
 const c=document.createElement('canvas');c.width=img.naturalWidth;c.height=1;const ctx=c.getContext('2d',{willReadFrequently:true});ctx.drawImage(img,0,0);const d=ctx.getImageData(0,0,c.width,1).data;const b=i=>d[i*4];
 if(c.width<6+pokemon.length||b(0)!==80||b(1)!==75||b(2)!==51||b(3)!==1||b(4)+256*b(5)!==pokemon.length)throw Error('このサイトで保存した元のPNG画像を選んでください。');
 const ids=[];for(let i=0;i<pokemon.length;i++)if(b(i+6)===1)ids.push(i);restoreIds(ids);status.textContent=ids.length+'体のチェックを画像から復元しました。';URL.revokeObjectURL(url);
 }catch(err){status.textContent='読み込み失敗：'+err.message}e.target.value='';};
function render(chosen=[]){result.replaceChildren();labels.forEach((name,i)=>{const slot=document.createElement('div');slot.className='slot';const title=document.createElement('h3');title.textContent=name;slot.append(title);if(chosen[i]){const im=document.createElement('img');im.src=chosen[i].img;im.alt='抽選されたポケモン';const skill=document.createElement('div');skill.className='skill';skill.textContent=chosen[i].skill;slot.append(im,skill)}else{const empty=document.createElement('div');empty.className='empty';empty.textContent='—';slot.append(empty)}result.append(slot)})}
function shuffle(arr){for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}return arr}
function findMatch(pools,used=new Set(),index=0){if(index===3)return [];for(const p of shuffle([...pools[index]])){if(used.has(p.id))continue;used.add(p.id);const tail=findMatch(pools,used,index+1);if(tail){return [p,...tail]}used.delete(p.id)}return null}
document.getElementById('draw').onclick=()=>{const pools=labels.map((_,i)=>pokemon.filter(p=>selected.has(p.id)&&p.cats.includes(i)));const missing=pools.map((a,i)=>a.length?null:labels[i]).filter(Boolean);if(missing.length){notice.textContent='候補がありません：'+missing.join('、');return}const answer=findMatch(pools);if(!answer){notice.textContent='3体を重複なく選べません。選択数を増やしてください。';return}notice.textContent='';render(answer)};
render();update();
</script></body></html>
